# Blueprint de Render para SPAZIO (backend + frontend).
# La base de datos NO va aquí: usa Supabase (tiene PostGIS) y pon su
# connection string en DATABASE_URL del backend.
#
# Cómo usar: en Render → New → Blueprint → conecta este repo. Render crea
# ambos servicios. Luego rellena las variables marcadas como sync:false.

services:
  # ---------- Backend (FastAPI) ----------
  - type: web
    name: spazio-api
    runtime: python
    rootDir: spazio-api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        sync: false          # pega aquí la connection string de Supabase
      - key: JWT_SECRET
        generateValue: true  # Render genera una clave segura
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: BOOKING_HOLD_MINUTES
        value: "10"
      - key: NOMINATIM_URL
        value: https://nominatim.openstreetmap.org
      - key: CORS_ORIGINS
        sync: false          # pon aquí la URL del frontend (https://spazio-web.onrender.com)

  # ---------- Frontend (sitio estático) ----------
  - type: web
    name: spazio-web
    runtime: static
    rootDir: spazio-app-conectado
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_API_URL
        sync: false          # pon aquí la URL del backend (https://spazio-api.onrender.com)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
