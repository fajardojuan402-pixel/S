# Postgres + PostGIS para desarrollo local (sin depender de Supabase todavía).
# Levanta la BD y aplica el schema automáticamente al iniciar por primera vez.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: spazio-db
    environment:
      POSTGRES_USER: spazio
      POSTGRES_PASSWORD: spazio
      POSTGRES_DB: spazio
    ports:
      - "5433:5432"
    volumes:
      - spazio_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spazio -d spazio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spazio_pgdata:
